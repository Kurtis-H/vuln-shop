name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # Older Python images bundle outdated packaging tools with known CVEs; update them first.
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (mypy)
        run: mypy --ignore-missing-imports app
      - name: Tests with coverage (fails under 80%)
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80 --junitxml=reports/junit.xml
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-report
          path: reports/junit.xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t vuln-shop .
      - name: Smoke test the container
        run: |
          docker run -d --name shop -p 127.0.0.1:8000:8000 vuln-shop
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs shop; exit 1
